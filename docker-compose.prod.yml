services:
  backend:
    image: hosteldesk/hostelpms:backend-latest
    container_name: hosteldesk-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend.env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://13.202.104.90:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: hosteldesk/hostelpms:frontend-latest
    container_name: hosteldesk-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hosteldesk-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
